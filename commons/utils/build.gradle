plugins {
    id 'java-library'
    id 'io.freefair.lombok' version '8.14'
}

repositories {
    mavenLocal()
    mavenCentral()
    maven { url "https://aws.oss.sonatype.org/content/repositories/snapshots" }
}

java {
    targetCompatibility = JavaVersion.VERSION_21
    sourceCompatibility = JavaVersion.VERSION_21
}

ext {
    aws_version = System.getProperty("aws.version", "1.12.687")
}

dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-core:2.17.1'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.1'
    implementation 'com.fasterxml.jackson.module:jackson-module-afterburner:2.17.1'
    api 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.17.1'
    implementation 'com.google.guava:guava:32.1.3-jre'
    api 'org.apache.logging.log4j:log4j-api:2.21.0'
    api 'org.apache.logging.log4j:log4j-core:2.21.0'

    api 'software.amazon.awssdk:s3:2.25.42'
    implementation 'software.amazon.awssdk:sts:2.25.42'
    api "com.amazonaws:aws-java-sdk-core:${aws_version}"
    api "com.amazonaws:aws-java-sdk-sts:${aws_version}"
    api "com.amazonaws:aws-java-sdk-s3:${aws_version}"

    testImplementation "org.mockito:mockito-inline:5.2.0"
    testImplementation "org.mockito:mockito-core:5.11.0"
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.1'
    testImplementation 'org.junit.jupiter:junit-jupiter-engine:5.8.1'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.8.1'
}

test {
    useJUnitPlatform()
}
