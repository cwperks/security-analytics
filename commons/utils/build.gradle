plugins {
    id 'java-library'
    id 'io.freefair.lombok' version '8.14'
}

repositories {
    mavenLocal()
    mavenCentral()
    maven { url "https://aws.oss.sonatype.org/content/repositories/snapshots" }
}

java {
    targetCompatibility = JavaVersion.VERSION_21
    sourceCompatibility = JavaVersion.VERSION_21
}

ext {
    aws_version = System.getProperty("aws.version", "1.12.687")
}

dependencies {
    // These are provided by the OpenSearch runtime — compile against them
    // but don't leak them into the root project's runtimeClasspath
    compileOnly 'com.fasterxml.jackson.core:jackson-core:2.17.1'
    compileOnly 'com.fasterxml.jackson.core:jackson-databind:2.17.1'
    compileOnly 'com.fasterxml.jackson.module:jackson-module-afterburner:2.17.1'
    compileOnly 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.17.1'
    compileOnly 'com.google.guava:guava:32.1.3-jre'
    compileOnly 'org.apache.logging.log4j:log4j-api:2.21.0'
    compileOnly 'org.apache.logging.log4j:log4j-core:2.21.0'

    // AWS SDK deps — these are NOT provided by OpenSearch, so they stay as api/implementation
    api 'software.amazon.awssdk:s3:2.25.42'
    implementation 'software.amazon.awssdk:sts:2.25.42'
    api "com.amazonaws:aws-java-sdk-core:${aws_version}"
    api "com.amazonaws:aws-java-sdk-sts:${aws_version}"
    api "com.amazonaws:aws-java-sdk-s3:${aws_version}"

    testImplementation 'com.fasterxml.jackson.core:jackson-core:2.17.1'
    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.17.1'
    testImplementation 'com.fasterxml.jackson.module:jackson-module-afterburner:2.17.1'
    testImplementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.17.1'
    testImplementation 'com.google.guava:guava:32.1.3-jre'
    testImplementation 'org.apache.logging.log4j:log4j-api:2.21.0'
    testImplementation 'org.apache.logging.log4j:log4j-core:2.21.0'
    testImplementation "org.mockito:mockito-inline:5.2.0"
    testImplementation "org.mockito:mockito-core:5.11.0"
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.1'
    testImplementation 'org.junit.jupiter:junit-jupiter-engine:5.8.1'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.8.1'
}

// Exclude transitive deps from AWS SDKs that conflict with OpenSearch-provided versions.
// Only apply to non-test configurations so unit tests can still resolve these.
configurations.matching { !it.name.toLowerCase().contains('test') }.all {
    exclude group: 'commons-logging', module: 'commons-logging'
    exclude group: 'commons-codec', module: 'commons-codec'
    exclude group: 'com.fasterxml.jackson.core', module: 'jackson-core'
    exclude group: 'com.fasterxml.jackson.core', module: 'jackson-databind'
    exclude group: 'com.fasterxml.jackson.core', module: 'jackson-annotations'
    exclude group: 'com.fasterxml.jackson.dataformat', module: 'jackson-dataformat-cbor'
    exclude group: 'org.slf4j', module: 'slf4j-api'
    exclude group: 'org.reactivestreams', module: 'reactive-streams'
    exclude group: 'com.google.guava', module: 'guava'
    exclude group: 'com.google.guava', module: 'failureaccess'
    exclude group: 'org.apache.logging.log4j', module: 'log4j-api'
    exclude group: 'org.apache.logging.log4j', module: 'log4j-core'
    exclude group: 'joda-time', module: 'joda-time'
    exclude group: 'com.google.errorprone', module: 'error_prone_annotations'
}

test {
    useJUnitPlatform()
}
