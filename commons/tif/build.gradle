plugins {
    id 'java-library'
    id 'io.freefair.lombok' version '8.14'
}

repositories {
    mavenLocal()
    mavenCentral()
    maven { url "https://aws.oss.sonatype.org/content/repositories/snapshots" }
}

java {
    targetCompatibility = JavaVersion.VERSION_21
    sourceCompatibility = JavaVersion.VERSION_21
}

dependencies {
    api project(':commons:utils')

    // Provided by OpenSearch runtime
    compileOnly 'com.fasterxml.jackson.core:jackson-core:2.17.1'
    compileOnly 'com.fasterxml.jackson.core:jackson-databind:2.17.1'
    compileOnly 'com.google.guava:guava:32.1.3-jre'

    testImplementation 'com.fasterxml.jackson.core:jackson-core:2.17.1'
    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.17.1'
    testImplementation 'com.google.guava:guava:32.1.3-jre'
    testImplementation "org.mockito:mockito-inline:5.2.0"
    testImplementation "org.mockito:mockito-core:5.11.0"
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.1'
    testImplementation 'org.junit.jupiter:junit-jupiter-engine:5.8.1'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.8.1'
}

// Exclude transitive deps that conflict with OpenSearch-provided versions.
// Only apply to non-test configurations so unit tests can still resolve these.
configurations.matching { !it.name.toLowerCase().contains('test') }.all {
    exclude group: 'commons-logging', module: 'commons-logging'
    exclude group: 'commons-codec', module: 'commons-codec'
    exclude group: 'com.fasterxml.jackson.core', module: 'jackson-core'
    exclude group: 'com.fasterxml.jackson.core', module: 'jackson-databind'
    exclude group: 'com.fasterxml.jackson.core', module: 'jackson-annotations'
    exclude group: 'com.fasterxml.jackson.dataformat', module: 'jackson-dataformat-cbor'
    exclude group: 'org.slf4j', module: 'slf4j-api'
    exclude group: 'org.reactivestreams', module: 'reactive-streams'
    exclude group: 'com.google.guava', module: 'guava'
    exclude group: 'com.google.guava', module: 'failureaccess'
    exclude group: 'org.apache.logging.log4j', module: 'log4j-api'
    exclude group: 'org.apache.logging.log4j', module: 'log4j-core'
    exclude group: 'joda-time', module: 'joda-time'
    exclude group: 'com.google.errorprone', module: 'error_prone_annotations'
}

test {
    useJUnitPlatform()
}
